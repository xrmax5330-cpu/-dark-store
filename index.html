<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">

  <title>DARK STORE | متجر شحن</title>

  <meta name="description" content="DARK STORE - متجر شحن وخدمات رقمية">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #151515 0%, #050505 45%, #000 100%);
      color: white;
      min-height: 100vh;
    }

    header {
      width: 100%;
      padding: 18px 25px;
      background: rgba(10,10,10,0.9);
      border-bottom: 1px solid #252525;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    nav {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      font-weight: 900;
    }

    /* صورة المتجر الدائرية */
    .logo {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #333;
      box-shadow: 0 0 20px rgba(255,255,255,0.08);
    }

    .hero {
      max-width: 1100px;
      margin: auto;
      padding: 70px 20px 50px;
      text-align: center;
    }

    .hero .logo-big {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #333;
      box-shadow: 0 0 35px rgba(255,255,255,0.12);
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(40px, 10vw, 75px);
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #aaa;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      background: white;
      color: black;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.85;
    }

    section {
      max-width: 1100px;
      margin: auto;
      padding: 35px 20px;
    }

    .title {
      text-align: center;
      font-size: 30px;
      margin-bottom: 25px;
      font-weight: 900;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .card {
      background: linear-gradient(145deg, #151515, #090909);
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 25px 15px;
      text-align: center;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #555;
    }

    .card h3 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .price {
      font-size: 25px;
      font-weight: 900;
      margin-bottom: 15px;
    }

    .buy {
      display: inline-block;
      background: white;
      color: black;
      padding: 10px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }

    .info {
      background: #0d0d0d;
      border: 1px solid #252525;
      border-radius: 18px;
      padding: 25px;
      text-align: center;
      line-height: 2;
    }

    footer {
      text-align: center;
      padding: 35px 15px;
      color: #777;
      border-top: 1px solid #222;
      margin-top: 40px;
    }

    @media (max-width: 600px) {
      header {
        padding: 12px 15px;
      }

      .logo {
        width: 45px;
        height: 45px;
      }

      .hero {
        padding-top: 50px;
      }

      .hero .logo-big {
        width: 125px;
        height: 125px;
      }
    }
  </style>
</head>

<body>

  <!-- الهيدر -->
  <header>
    <nav>

      <div class="brand">

        <img
          class="logo"
          src="https://i.ibb.co/S4Cs8DKw/7-C5-B0310-83-D7-41-D4-9-E1-D-1-EDAF3638362.png"
          alt="DARK STORE"
        >

        <span>DARK STORE</span>

      </div>

    </nav>
  </header>


  <!-- بداية الموقع -->
  <main>

    <div class="hero">

      <img
        class="logo-big"
        src="https://i.ibb.co/S4Cs8DKw/7-C5-B0310-83-D7-41-D4-9-E1-D-1-EDAF3638362.png"
        alt="DARK STORE"
      >

      <h1>DARK STORE</h1>

      <p class="subtitle">
        متجر شحن وخدمات رقمية
      </p>

      <a href="#prices" class="btn">
        عرض الأسعار
      </a>

    </div>


    <!-- الأسعار -->
    <section id="prices">

      <h2 class="title">أسعار الشحن</h2>

      <div class="grid">

        <div class="card">
          <h3>40 روبوكس</h3>
          <div class="price">5 د.ل</div>
          <a href="#" class="buy">شراء</a>
        </div>

        <div class="card">
          <h3>80 روبوكس</h3>
          <div class="price">13 د.ل</div>
          <a href="#" class="buy">شراء</a>
        </div>

        <div class="card">
          <h3>120 روبوكس</h3>
          <div class="price">23 د.ل</div>
          <a href="#" class="buy">شراء</a>
        </div>

        <div class="card">
          <h3>160 روبوكس</h3>
          <div class="price">28 د.ل</div>
          <a href="#" class="buy">شراء</a>
        </div>

      </div>

    </section>


    <!-- معلومات -->
    <section>

      <div class="info">

        <h2>🖤 DARK STORE</h2>

        <p>
          شحن سريع وآمن 🎮
        </p>

        <p>
          للدفع والاستفسار تواصل معنا
        </p>

      </div>

    </section>

  </main>


  <footer>
    © 2026 DARK STORE — جميع الحقوق محفوظة
  </footer>

</body>
</html>
