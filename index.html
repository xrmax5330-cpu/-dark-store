<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>القائمة الجانبية</title>
  <!-- خط تجوال من Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    /* الإعدادات العامة للموقع */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      background-color: #0b0f12;
      color: #ffffff;
      direction: rtl;
    }

    /* حاوية القائمة الجانبية */
    .sidebar-drawer {
      width: 320px;
      max-width: 100%;
      background-color: #0f1317;
      height: 100vh;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    /* رأس القائمة (الشعار والزر إغلاق) */
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #1e262c;
      border: 1px solid #2d3740;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 13px;
      color: #fff;
    }

    .logo-text h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .logo-text span {
      font-size: 12px;
      color: #8b96a0;
    }

    .close-btn {
      background: none;
      border: none;
      color: #8b96a0;
      font-size: 26px;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    /* عناصر القائمة (البطاقات) */
    .drawer-content {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .menu-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #161b22;
      padding: 14px 16px;
      border-radius: 16px;
      text-decoration: none;
      color: #ffffff;
      border: 1px solid transparent;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .menu-card:hover {
      background-color: #1c232c;
    }

    .menu-card.active-border {
      border-color: #1b4332;
    }

    .card-info h4 {
      margin: 0 0 4px 0;
      font-size: 15px;
      font-weight: 700;
    }

    .card-info p {
      margin: 0;
      font-size: 12px;
      color: #8b96a0;
    }

    /* ألوان الأيقونات الدائرية */
    .card-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-green {
      background-color: #152922;
      color: #34d399;
    }

    .icon-yellow {
      background-color: #2a2515;
      color: #fbbf24;
    }

    /* قسم تواصل معنا */
    .section-title {
      margin-top: 14px;
      margin-bottom: 2px;
      font-size: 14px;
      color: #ffffff;
      font-weight: 700;
    }

    .whatsapp-card {
      background-color: #0c271d;
      border: 1px solid #134e38;
    }

    .whatsapp-card .card-icon {
      background-color: transparent;
      color: #ffffff;
    }

    .links-card {
      background-color: #121d2b;
      border: 1px solid #1e2e42;
    }

    .links-card .card-icon {
      background-color: transparent;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- القائمة الجانبية -->
  <div class="sidebar-drawer">
    
    <!-- رأس القائمة -->
    <div class="drawer-header">
      <div class="logo-section">
        <div class="logo-icon">MD+</div>
        <div class="logo-text">
          <h3>متجر MDCard</h3>
          <span>اشتراكات رقمية</span>
        </div>
      </div>
      <button class="close-btn">&times;</button>
    </div>

    <!-- المحتوى والروابط -->
    <div class="drawer-content">
      
      <!-- حسابي -->
      <a href="#" class="menu-card">
        <div class="card-info">
          <h4>حسابي</h4>
          <p>عرض حسابك وااشتراكاتك</p>
        </div>
        <div class="card-icon icon-green">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
      </a>

      <!-- المنتجات -->
      <a href="#" class="menu-card">
        <div class="card-info">
          <h4>المنتجات</h4>
          <p>تصفح جميع المنتجات</p>
        </div>
        <div class="card-icon icon-green">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
        </div>
      </a>

      <!-- التقييمات -->
      <a href="#" class="menu-card active-border">
        <div class="card-info">
          <h4>التقييمات</h4>
          <p>تقييمات عملائنا</p>
        </div>
        <div class="card-icon icon-yellow">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        </div>
      </a>

      <!-- الأسئلة الشائعة -->
      <a href="#" class="menu-card">
        <div class="card-info">
          <h4>الأسئلة الشائعة</h4>
          <p>إجابات عن معظم الاستفسارات</p>
        </div>
        <div class="card-icon icon-yellow">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        </div>
      </a>

      <!-- قسم تواصل معنا -->
      <div class="section-title">تواصل معنا</div>

      <!-- واتساب -->
      <a href="https://wa.me/218943190471" class="menu-card whatsapp-card" target="_blank">
        <div class="card-info">
          <h4>واتساب</h4>
          <p dir="ltr">+218 943 190 471</p>
        </div>
        <div class="card-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        </div>
      </a>

      <!-- جميع الروابط -->
      <a href="#" class="menu-card links-card">
        <div class="card-info">
          <h4>جميع الروابط</h4>
          <p>تابعنا على جميع المنصات</p>
        </div>
        <div class="card-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
        </div>
      </a>

    </div>
  </div>

</body>
</html>
