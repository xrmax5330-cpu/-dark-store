<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>Dark Store | متجر شحن</title>

<style>
:root{
    --bg:#050505;
    --bg2:#101010;
    --card:#111111;
    --card2:#171717;
    --line:#292929;
    --text:#ffffff;
    --muted:#999999;
    --blue:#168cff;
    --blue2:#006fe6;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    color:var(--text);
    min-height:100vh;

    /* الخلفية الجديدة */
    background:
        radial-gradient(circle at 50% -10%, #303030 0%, #171717 22%, #090909 48%, #020202 100%);

    background-attachment:fixed;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 15% 25%, rgba(255,255,255,.035), transparent 25%),
        radial-gradient(circle at 85% 70%, rgba(255,255,255,.025), transparent 30%);
    z-index:-1;
}

header{
    position:sticky;
    top:0;
    z-index:20;
    height:74px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;

    background:rgba(5,5,5,.88);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-bottom:1px solid rgba(255,255,255,.09);
}

.logo-title{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-title img{
    width:48px;
    height:48px;
    object-fit:cover;
    border-radius:50%;
    border:1px solid #333;
}

.logo-title h1{
    font-size:24px;
    font-weight:800;
    letter-spacing:.5px;
}

.price-btn{
    border:1px solid #333;
    background:#101010;
    color:#fff;
    padding:12px 20px;
    border-radius:18px;
    font-size:16px;
    cursor:pointer;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:28px 16px 60px;
}

.hero{
    text-align:center;
    margin-bottom:25px;
}

.hero img{
    width:150px;
    height:150px;
    object-fit:cover;
    border-radius:50%;
    border:2px solid #333;
    box-shadow:
        0 0 35px rgba(255,255,255,.08),
        0 0 80px rgba(0,0,0,.8);
}

.hero h2{
    margin-top:15px;
    font-size:30px;
    font-weight:900;
}

.hero p{
    margin-top:8px;
    color:#999;
    font-size:16px;
}

.payment-title{
    text-align:center;
    color:#aaa;
    font-size:18px;
    margin:22px 0 14px;
}

.payment-methods{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:25px;
}

.payment-btn{
    height:65px;
    border-radius:22px;
    border:1px solid #333;
    background:#111;
    color:#aaa;
    font-size:20px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

.payment-btn.active{
    color:#fff;
    background:var(--blue);
    border-color:var(--blue);
    box-shadow:0 8px 25px rgba(22,140,255,.25);
}

.products{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.product{
    background:
        linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),
        #0d0d0d;

    border:1px solid #292929;
    border-radius:25px;
    padding:22px 18px;
    text-align:center;

    box-shadow:
        0 12px 35px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.025);

    transition:.2s;
}

.product:hover{
    transform:translateY(-2px);
    border-color:#3c3c3c;
}

.product.robux{
    font-size:25px;
    font-weight:900;
}

.product .robux span{
    font-size:20px;
}

.price{
    margin-top:10px;
    color:var(--blue);
    font-size:21px;
    font-weight:800;
}

.buy{
    width:100%;
    height:48px;
    margin-top:18px;

    border-radius:16px;
    border:1px solid #303030;
    background:#151515;
    color:white;

    font-size:17px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

.buy:hover{
    background:var(--blue);
    border-color:var(--blue);
}

.modal{
    position:fixed;
    inset:0;
    z-index:100;

    display:none;
    align-items:center;
    justify-content:center;

    padding:18px;

    background:rgba(0,0,0,.78);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:470px;

    background:
        linear-gradient(145deg,#181818,#0b0b0b);

    border:1px solid #333;
    border-radius:26px;
    padding:24px;

    box-shadow:0 25px 80px rgba(0,0,0,.8);
}

.modal-box h3{
    text-align:center;
    font-size:25px;
    margin-bottom:8px;
}

.selected{
    text-align:center;
    color:#999;
    margin-bottom:20px;
}

.input{
    width:100%;
    height:54px;

    background:#111;
    color:#fff;

    border:1px solid #303030;
    border-radius:15px;

    padding:0 15px;
    margin-bottom:12px;

    font-size:16px;
    outline:none;
}

.input:focus{
    border-color:var(--blue);
}

.submit{
    width:100%;
    height:54px;

    border:0;
    border-radius:16px;

    background:var(--blue);
    color:white;

    font-size:18px;
    font-weight:900;

    cursor:pointer;
}

.close{
    width:100%;
    height:48px;

    margin-top:10px;

    border:1px solid #333;
    border-radius:15px;

    background:#151515;
    color:#aaa;

    font-size:16px;
    cursor:pointer;
}

.note{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-top:18px;
    line-height:1.7;
}

footer{
    text-align:center;
    color:#666;
    font-size:13px;
    margin-top:40px;
}

@media(max-width:600px){

    .products{
        grid-template-columns:1fr 1fr;
        gap:12px;
    }

    .product{
        padding:20px 12px;
        border-radius:22px;
    }

    .product .robux{
        font-size:22px;
    }

    .price{
        font-size:19px;
    }

    .buy{
        font-size:15px;
    }

    .hero img{
        width:135px;
        height:135px;
    }
}

@media(max-width:380px){

    .products{
        grid-template-columns:1fr;
    }

}
</style>
</head>

<body>

<header>

    <div class="logo-title">
        <img src="https://i.ibb.co/S4Cs8DKw/7-C5-B0310-83-D7-41-D4-9-E1-D-1-EDAF3638362.png">
        <h1>Dark Store</h1>
    </div>

    <button class="price-btn" onclick="scrollToPrices()">
        الأسعار
    </button>

</header>


<main class="container">

    <section class="hero">

        <img src="https://i.ibb.co/S4Cs8DKw/7-C5-B0310-83-D7-41-D4-9-E1-D-1-EDAF3638362.png">

        <h2>Dark Store</h2>

        <p>متجر شحن روبوكس</p>

    </section>


    <div class="payment-title">
        اختر طريقة الدفع
    </div>


    <div class="payment-methods">

        <button
            class="payment-btn active"
            id="madarBtn"
            onclick="selectPayment('مدار')">
            مدار
        </button>

        <button
            class="payment-btn"
            id="libyanaBtn"
            onclick="selectPayment('ليبيانا')">
            ليبيانا
        </button>

    </div>


    <section class="products" id="prices">

        <div class="product">
            <div class="robux">10 <span>روب</span></div>
            <div class="price">5 مدار</div>
            <button class="buy" onclick="openOrder(10,5)">شراء</button>
        </div>


        <div class="product">
            <div class="robux">20 <span>روب</span></div>
            <div class="price">7 مدار</div>
            <button class="buy" onclick="openOrder(20,7)">شراء</button>
        </div>


        <div class="product">
            <div class="robux">30 <span>روب</span></div>
            <div class="price">10 مدار</div>
            <button class="buy" onclick="openOrder(30,10)">شراء</button>
        </div>


        <div class="product">
            <div class="robux">40 <span>روب</span></div>
            <div class="price">15 مدار</div>
            <button class="buy" onclick="openOrder(40,15)">شراء</button>
        </div>


        <div class="product">
            <div class="robux">80 <span>روب</span></div>
            <div class="price">22 مدار</div>
            <button class="buy" onclick="openOrder(80,22)">شراء</button>
        </div>


        <div class="product">
            <div class="robux">120 <span>روب</span></div>
            <div class="price">33 مدار</div>
            <button class="buy" onclick="openOrder(120,33)">شراء</button>
        </div>


    </section>


    <div class="note">
        بعد الضغط على شراء، قم بإدخال بيانات حسابك لإتمام الطلب.
    </div>


    <footer>
        © 2026 Dark Store
    </footer>

</main>


<!-- نافذة الطلب -->

<div class="modal" id="orderModal">

    <div class="modal-box">

        <h3>إتمام الطلب</h3>

        <div class="selected" id="selectedProduct"></div>


        <input
            class="input"
            id="robloxUser"
            type="text"
            placeholder="يوزر حسابك في روبلوكس">


        <input
            class="input"
            id="customerName"
            type="text"
            placeholder="اسمك">


        <input
            class="input"
            id="customerPhone"
            type="tel"
            placeholder="رقم هاتفك">


        <button class="submit" onclick="sendOrder()">
            إرسال الطلب
        </button>


        <button class="close" onclick="closeOrder()">
            إلغاء
        </button>

    </div>

</div>


<script>

let selectedPayment = "مدار";
let selectedRobux = 0;
let selectedPrice = 0;


/* اختيار طريقة الدفع */

function selectPayment(method){

    selectedPayment = method;

    const madar = document.getElementById("madarBtn");
    const libyana = document.getElementById("libyanaBtn");

    if(method === "مدار"){

        madar.classList.add("active");
        libyana.classList.remove("active");

    }else{

        libyana.classList.add("active");
        madar.classList.remove("active");

    }

    updatePrices(method);
}


/* تحديث كلمة الدفع */

function updatePrices(method){

    document.querySelectorAll(".price").forEach(function(el){

        const value = el.innerText.match(/\d+/);

        if(value){
            el.innerText = value[0] + " " + method;
        }

    });

}


/* فتح الطلب */

function openOrder(robux, price){

    selectedRobux = robux;
    selectedPrice = price;

    document.getElementById("selectedProduct").innerText =
        robux + " روبوكس — " +
        price + " " +
        selectedPayment;

    document.getElementById("orderModal").classList.add("show");
}


/* إغلاق الطلب */

function closeOrder(){

    document.getElementById("orderModal").classList.remove("show");

}


/* إرسال الطلب إلى واتساب */

function sendOrder(){

    const username =
        document.getElementById("robloxUser").value.trim();

    const name =
        document.getElementById("customerName").value.trim();

    const phone =
        document.getElementById("customerPhone").value.trim();


    if(!username || !name || !phone){

        alert("يرجى تعبئة جميع البيانات.");

        return;
    }


    const message =
        "طلب جديد من Dark Store%0A%0A" +

        "المنتج: " +
        selectedRobux +
        " روبوكس%0A" +

        "السعر: " +
        selectedPrice +
        " " +
        selectedPayment +
        "%0A%0A" +

        "يوزر روبلوكس: " +
        encodeURIComponent(username) +
        "%0A" +

        "اسم العميل: " +
        encodeURIComponent(name) +
        "%0A" +

        "رقم الهاتف: " +
        encodeURIComponent(phone);


    /*
      ضع رقم واتساب المتجر هنا
      مثال:
      218912345678
    */

    const whatsappNumber = "218XXXXXXXXXX";


    window.open(
        "https://wa.me/" +
        whatsappNumber +
        "?text=" +
        message,
        "_blank"
    );

}


/* زر الأسعار */

function scrollToPrices(){

    document.getElementById("prices").scrollIntoView({
        behavior:"smooth"
    });

}


/* إغلاق النافذة عند الضغط خارجها */

document.getElementById("orderModal").addEventListener(
    "click",
    function(e){

        if(e.target === this){
            closeOrder();
        }

    }
);

</script>

</body>
</html>
