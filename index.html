<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#12100e">

<title>Dark Store | متجر شحن</title>

<style>
:root {
  --bg-dark: #12100e;
  --bg-gradient: radial-gradient(circle at top, #241d15 0%, #12100e 60%, #0a0908 100%);
  --card-bg: #1a1714;
  --card-border: #2e2820;
  --sand-gold: #d4af37;
  --sand-light: #f3e5ab;
  --sand-accent: #e5c158;
  --text-main: #fcfbf7;
  --text-muted: #b3a998;
  --line: #332b22;
  --whatsapp-green: #25d366;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg-gradient);
  color: var(--text-main);
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  min-height: 100vh;
}

button, input, textarea {
  font-family: inherit;
}

/* شريط التنبيهات الأعلى */
.announcement-bar {
  background: linear-gradient(90deg, #b89320, var(--sand-gold), #b89320);
  color: #12100e;
  font-weight: 800;
  font-size: 13px;
  text-align: center;
  padding: 6px 10px;
  letter-spacing: 0.5px;
}

header {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(18, 16, 14, 0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}

nav {
  height: 70px;
  max-width: 1100px;
  margin: auto;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  font-size: 24px;
  font-weight: 900;
  letter-spacing: 1px;
  color: var(--sand-gold);
  text-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
  cursor: pointer;
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.nav-btn {
  background: #1a1714;
  border: 1px solid var(--sand-gold);
  border-radius: 12px;
  padding: 9px 16px;
  cursor: pointer;
  color: var(--sand-gold);
  font-size: 14px;
  font-weight: bold;
  transition: all 0.3s ease;
}

.nav-btn:hover {
  background: var(--sand-gold);
  color: #12100e;
  box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
}

/* زر السلة */
.cart-trigger {
  position: relative;
  background: #241d15;
  border: 1px solid var(--sand-gold);
  color: var(--sand-light);
  padding: 9px 14px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: bold;
  display: flex;
  align-items: center;
  gap: 6px;
}

.cart-count {
  background: var(--sand-gold);
  color: #12100e;
  border-radius: 50%;
  width: 20px;
  height: 20px;
  font-size: 11px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
}

.hero {
  max-width: 1100px;
  margin: auto;
  padding: 45px 20px 25px;
  text-align: center;
}

.logo {
  width: 170px;
  height: 170px;
  object-fit: cover;
  border-radius: 50%;
  display: block;
  margin: 0 auto 25px;
  border: 3px solid var(--sand-gold);
  box-shadow: 
    0 0 25px rgba(212, 175, 55, 0.25),
    0 0 60px rgba(212, 175, 55, 0.1);
}

.hero h1 {
  font-size: clamp(38px, 8vw, 68px);
  font-weight: 900;
  margin-bottom: 10px;
}

.hero h1 span {
  color: var(--sand-gold);
}

.hero p {
  color: var(--text-muted);
  font-size: 17px;
  line-height: 1.8;
}

section {
  max-width: 1100px;
  margin: auto;
  padding: 25px 20px 45px;
}

.title {
  text-align: center;
  margin-bottom: 25px;
}

.title h2 {
  font-size: 32px;
  margin-bottom: 8px;
  color: var(--sand-light);
}

.title p {
  color: var(--text-muted);
}

/* شريط البحث */
.search-container {
  max-width: 500px;
  margin: 0 auto 25px;
  position: relative;
}

.search-input {
  width: 100%;
  padding: 14px 20px;
  border-radius: 30px;
  background: #181512;
  border: 1px solid var(--card-border);
  color: var(--text-main);
  font-size: 15px;
  outline: none;
  transition: all 0.3s;
}

.search-input:focus {
  border-color: var(--sand-gold);
  box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
}

/* اختيار الأقسام */
.category-box {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 30px;
  flex-wrap: wrap;
}

.cat-btn {
  flex: 1;
  min-width: 120px;
  max-width: 160px;
  padding: 12px 8px;
  border-radius: 16px;
  border: 2px solid var(--card-border);
  background: #181512;
  color: var(--text-muted);
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.3s ease;
}

.cat-icon-img {
  width: 22px;
  height: 22px;
  object-fit: contain;
  border-radius: 4px;
}

.cat-btn:hover {
  border-color: var(--sand-gold);
  color: var(--sand-light);
  transform: translateY(-2px);
}

.cat-btn.active {
  background: linear-gradient(135deg, #2a231b, #1a1612);
  border-color: var(--sand-gold);
  color: var(--sand-gold);
  box-shadow: 0 0 20px rgba(212, 175, 55, 0.25);
}

/* اختيار الشركات (مدار / ليبيانا) */
.provider-box {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-bottom: 30px;
  flex-wrap: wrap;
}

.provider-btn {
  min-width: 140px;
  padding: 10px 20px;
  border-radius: 12px;
  border: 1px solid var(--card-border);
  background: #181512;
  color: var(--text-muted);
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: all 0.3s ease;
}

.provider-btn img {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  object-fit: cover;
}

.provider-btn:hover {
  border-color: var(--sand-gold);
  color: var(--sand-light);
}

.provider-btn.active {
  background: linear-gradient(135deg, var(--sand-gold), #b89320);
  border-color: var(--sand-gold);
  color: #12100e;
  box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
}

/* شبكة الأسعار */
.prices {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 18px;
}

/* شبكة الأفكتمات المربعة */
.effects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 15px;
}

.effect-card {
  background: linear-gradient(145deg, #1e1a16, #14110e);
  border: 2px solid var(--card-border);
  border-radius: 18px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  text-align: center;
  transition: all 0.3s ease;
  position: relative;
}

.effect-card:hover {
  transform: translateY(-5px);
  border-color: var(--sand-gold);
  box-shadow: 0 8px 25px rgba(212, 175, 55, 0.2);
}

.effect-img {
  width: 100%;
  height: 120px;
  object-fit: cover;
  border-radius: 12px;
  margin-bottom: 8px;
}

.effect-title {
  font-size: 15px;
  font-weight: 800;
  color: var(--sand-light);
  margin-bottom: 4px;
}

.effect-price {
  font-size: 17px;
  font-weight: 900;
  color: var(--sand-gold);
  margin-bottom: 8px;
}

.btn-group-card {
  display: flex;
  gap: 6px;
  width: 100%;
}

.effect-buy-btn, .add-cart-btn {
  flex: 1;
  padding: 8px 4px;
  border-radius: 8px;
  background: #26211b;
  color: var(--sand-light);
  border: 1px solid var(--card-border);
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.2s ease;
}

.effect-buy-btn:hover, .add-cart-btn:hover {
  background: var(--sand-gold);
  color: #12100e;
  border-color: var(--sand-gold);
}

/* شارات التميز */
.badge-tag {
  position: absolute;
  top: -8px;
  right: 10px;
  background: var(--sand-gold);
  color: #12100e;
  font-size: 10px;
  font-weight: 900;
  padding: 2px 8px;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  z-index: 2;
}

/* بطاقات الروبوكس */
.price-card {
  background: linear-gradient(145deg, #1e1a16, #14110e);
  border: 1px solid var(--card-border);
  border-radius: 18px;
  padding: 22px 18px;
  text-align: center;
  transition: all 0.3s ease;
  position: relative;
}

.price-card:hover {
  transform: translateY(-5px);
  border-color: var(--sand-gold);
  box-shadow: 0 8px 25px rgba(212, 175, 55, 0.15);
}

.price-card.disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.price-card.disabled:hover {
  transform: none;
  border-color: var(--card-border);
  box-shadow: none;
}

.robux {
  font-size: 25px;
  font-weight: 900;
  margin-bottom: 8px;
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.robux-icon {
  width: 24px;
  height: 24px;
  object-fit: cover;
  border-radius: 4px;
}

.price {
  font-size: 19px;
  font-weight: 800;
  color: var(--sand-gold);
}

.buy {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  background: #26211b;
  color: var(--sand-light);
  border: 1px solid var(--card-border);
  cursor: pointer;
  font-weight: bold;
  transition: all 0.2s ease;
}

.buy:hover:not(:disabled) {
  background: var(--sand-gold);
  color: #12100e;
  border-color: var(--sand-gold);
}

.buy:disabled {
  background: #1c1916;
  color: #666;
  cursor: not-allowed;
  border-color: transparent;
}

/* بطاقات الألعاب والبطاقات المباشرة */
.item-card {
  background: linear-gradient(145deg, #1e1a16, #14110e);
  border: 1px solid var(--card-border);
  border-radius: 18px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.item-card:hover {
  transform: translateY(-5px);
  border-color: var(--sand-gold);
  box-shadow: 0 8px 25px rgba(212, 175, 55, 0.15);
}

.item-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 15px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 10px;
}

.item-title {
  font-size: 16px;
  font-weight: 800;
  color: var(--sand-light);
}

.item-sub {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 3px;
}

.badge-icon {
  font-size: 20px;
  display: flex;
  align-items: center;
}

.item-price-box {
  text-align: right;
  margin-bottom: 10px;
}

.item-price-label {
  font-size: 12px;
  color: var(--text-muted);
}

.item-price-val {
  font-size: 22px;
  font-weight: 900;
  color: var(--sand-gold);
}

.notice {
  margin-top: 25px;
  padding: 15px;
  background: #181512;
  border: 1px solid var(--card-border);
  border-radius: 14px;
  text-align: center;
  color: var(--text-muted);
  font-size: 14px;
}

/* قسم التقييمات */
.reviews-section {
  border-top: 1px solid var(--line);
  padding-top: 40px;
  margin-top: 40px;
}

.reviews-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 15px;
  margin-top: 20px;
}

.review-card {
  background: #181512;
  border: 1px solid var(--card-border);
  border-radius: 14px;
  padding: 15px;
}

.review-stars {
  color: var(--sand-gold);
  margin-bottom: 8px;
  font-size: 14px;
}

.review-text {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 10px;
  line-height: 1.5;
}

.review-author {
  font-size: 12px;
  font-weight: bold;
  color: var(--sand-light);
}

/* زر التواصل السريع للواتساب */
.whatsapp-float {
  position: fixed;
  bottom: 25px;
  left: 25px;
  background: var(--whatsapp-green);
  color: white;
  width: 55px;
  height: 55px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
  z-index: 1500;
  text-decoration: none;
  transition: transform 0.3s;
}

.whatsapp-float:hover {
  transform: scale(1.1);
}

footer {
  border-top: 1px solid var(--line);
  margin-top: 40px;
  padding: 30px 20px;
  text-align: center;
  color: var(--text-muted);
}

/* تصميم المودال المحدث المطابق للفيديو */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  padding: 15px;
}

.modal.show {
  display: flex;
}

.modal-box {
  width: 100%;
  max-width: 440px;
  background: #181512;
  border: 1px solid var(--sand-gold);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 0 35px rgba(212, 175, 55, 0.2);
  max-height: 92vh;
  overflow-y: auto;
}

.header-tag-modal {
  display: block;
  text-align: center;
  color: var(--sand-gold);
  font-size: 0.85rem;
  font-weight: bold;
  background: rgba(212, 175, 55, 0.1);
  padding: 4px 12px;
  border-radius: 20px;
  width: fit-content;
  margin: 0 auto 8px;
}

.modal-box h3 {
  text-align: center;
  font-size: 22px;
  margin-bottom: 4px;
  color: var(--sand-light);
}

.modal-sub {
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
  margin-bottom: 18px;
}

.card-inner {
  background: #110f0d;
  border: 1px solid var(--card-border);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 15px;
}

.card-inner-title {
  font-size: 14px;
  font-weight: bold;
  color: var(--sand-light);
  margin-bottom: 10px;
}

.summary-flex {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #1a1714;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid var(--card-border);
}

.transfer-box {
  background: #1a1714;
  border: 1px dashed var(--sand-gold);
  border-radius: 12px;
  padding: 12px;
  text-align: center;
  margin-bottom: 12px;
}

.phone-number-val {
  font-size: 1.3rem;
  font-weight: bold;
  color: var(--sand-gold);
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.copy-btn {
  background: #26211b;
  color: var(--sand-light);
  border: 1px solid var(--card-border);
  padding: 8px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  width: 100%;
  transition: all 0.2s;
  font-weight: bold;
}

.copy-btn:hover {
  background: var(--sand-gold);
  color: #12100e;
}

.steps-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 12px;
  color: var(--text-muted);
}

.steps-list li {
  display: flex;
  align-items: center;
  gap: 8px;
}

.step-num {
  background: rgba(212, 175, 55, 0.15);
  color: var(--sand-gold);
  width: 20px;
  height: 20px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 11px;
}

.input-label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 6px;
  color: var(--text-main);
}

.input-label span {
  color: #e74c3c;
}

.input {
  width: 100%;
  padding: 12px;
  margin-bottom: 6px;
  background: #1a1714;
  color: var(--text-main);
  border: 1px solid var(--card-border);
  border-radius: 10px;
  outline: none;
  font-size: 14px;
  transition: border-color 0.2s;
}

.input:focus {
  border-color: var(--sand-gold);
}

.hint-txt {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 12px;
  display: block;
}

.checkbox-group {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: #110f0d;
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 15px;
  border: 1px solid var(--card-border);
}

.checkbox-group input {
  margin-top: 2px;
  accent-color: var(--sand-gold);
  width: 16px;
  height: 16px;
}

.checkbox-group label {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.4;
  cursor: pointer;
}

.cart-items-list {
  margin-bottom: 15px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 10px;
}

.cart-item-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  font-size: 14px;
  color: var(--text-muted);
}

.cart-item-row button {
  background: transparent;
  border: none;
  color: #e74c3c;
  cursor: pointer;
  font-weight: bold;
}

.confirm {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--sand-gold), #b89320);
  border: 0;
  border-radius: 12px;
  color: #12100e;
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
  transition: opacity 0.2s;
}

.confirm:hover {
  opacity: 0.9;
}

.close {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  background: transparent;
  border: 1px solid var(--card-border);
  border-radius: 12px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s;
}

.close:hover {
  color: var(--text-main);
  background: #24201a;
}

@media(max-width:500px) {
  .prices {
    grid-template-columns: repeat(2, 1fr);
  }

  .effects-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .price-card, .item-card {
    padding: 16px 10px;
  }

  .robux {
    font-size: 20px;
  }

  .robux-icon {
    width: 20px;
    height: 20px;
  }

  .price {
    font-size: 16px;
  }

  .logo {
    width: 145px;
    height: 145px;
  }
}
</style>
</head>

<body>

<div class="announcement-bar">
  تسليم سريع وآمن لجميع البطاقات والألعاب - خصومات خاصة لشحن الروبوكس
</div>

<header>
  <nav>
    <div class="brand" onclick="switchCategory('robux')">
      Dark Store
    </div>
    <div class="nav-actions">
      <button class="cart-trigger" onclick="openCartModal()">
        السلة <span id="cartCount" class="cart-count">0</span>
      </button>
      <button class="nav-btn" onclick="scrollToPrices()">
        الأسعار
      </button>
    </div>
  </nav>
</header>

<main>

  <div class="hero">
    <img src="https://i.ibb.co/S4Cs8DKw/7-C5-B0310-83-D7-41-D4-9-E1-D-1-EDAF3638362.png" class="logo" alt="Dark Store">
    <h1>
      Dark <span>Store</span>
    </h1>
    <p>
      متجر شحن ألعاب، إفكتات وبطاقات أيتونز وبلايستيشن وإكس بوكس
